<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agenda de Ensaios — Entrar</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎸</text></svg>" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="logo">🎸</div>
      <h1>Agenda de Ensaios</h1>
      <p>Marque sua presença nos ensaios e eventos da banda.</p>

      <!-- Produção: login com Google -->
      <div id="google-area">
        <button class="google-btn" id="btn-google">
          <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
          Entrar com Google
        </button>
      </div>

      <!-- Local (Docker): login por e-mail/senha — é o "mock" de autenticação -->
      <div id="email-area" style="display:none">
        <div class="divider">ou com e-mail (ambiente local)</div>
        <form id="form-login" style="text-align:left">
          <label class="field"><span>E-mail</span>
            <input type="email" id="li-email" placeholder="ana@teste.com" autocomplete="username" required />
          </label>
          <label class="field"><span>Senha</span>
            <input type="password" id="li-pass" placeholder="123456" autocomplete="current-password" required />
          </label>
          <button class="btn primary" id="btn-login" style="width:100%">Entrar</button>
          <button type="button" class="btn ghost" id="btn-signup" style="width:100%;margin-top:8px">Criar conta local</button>
          <p id="li-msg" class="muted" style="min-height:1.2em"></p>
        </form>
        <p class="muted" style="font-size:.75rem">
          Testes: ana@, bruno@, carla@, diego@, elisa@, felipe@, gabriela@, henrique@teste.com · senha 123456
        </p>
      </div>
    </div>
  </div>

  <script type="module" src="/js/login.js"></script>
</body>
</html>
