server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # cache agressivo p/ JS/CSS (mudar o arquivo já invalida na prática)
    location ~* \.(js|css|svg|png|jpg|webp|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}